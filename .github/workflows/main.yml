name: R CI

on:
  push:

jobs:
  R-CMD-CHECK:

    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Install Gemmi
        run: |
          python -m pip install --upgrade pip
          python -m pip install gemmi

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("bio3d", "ggplot2", "knitr", "rmarkdown", "shiny", "DT", "digest", "markdown"))'

      - name: Build POPSR
        run: |
          R CMD build POPSR

      ## 'shinysky' (Suggests) is not on CRAN, so allow checking without it
      - name: Check POPSR
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        run: |
          R CMD check --no-manual POPSR_*.tar.gz
